<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛事管理 - 管理后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html">数据概览</a>
        <a href="content.html">内容管理</a>
        <a href="images.html">图片管理</a>
        <a href="competitions.html" class="active">赛事管理</a>
        <a href="members.html">队员管理</a>
        <a href="recruits.html">招新管理</a>
        <a href="sponsors.html">赞助商管理</a>
        <a href="messages.html">留言管理</a>
        <a href="settings.html">账号设置</a>
      </nav>
      <div class="admin-footer">
        <a href="#" onclick="logout()">退出登录</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>赛事管理</h1>
        <div class="admin-user">管理员</div>
      </header>
      <div class="admin-content">
        <div class="page-toolbar">
          <h2>赛事列表</h2>
          <button class="btn btn-primary" onclick="openModal()">+ 新增赛事</button>
        </div>
        <div class="admin-table">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>标题</th>
                <th>年份</th>
                <th>地点</th>
                <th>成绩</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="competition-list">
            </tbody>
          </table>
          <div class="empty-state" id="empty-state" style="display:none;">暂无赛事记录</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑模态框 -->
  <div class="modal-overlay" id="competition-modal">
    <div class="modal-dialog" style="width:600px;">
      <div class="modal-header">
        <h3 id="modal-title">新增赛事</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="competition-id">
        <div class="form-group">
          <label>赛事标题 *</label>
          <input type="text" class="form-control" id="competition-title" placeholder="如：2024 中国巴哈大赛">
        </div>
        <div class="form-group" style="display:inline-block; width:48%; margin-right:4%;">
          <label>年份 *</label>
          <input type="number" class="form-control" id="competition-year" placeholder="2024">
        </div>
        <div class="form-group" style="display:inline-block; width:48%;">
          <label>日期</label>
          <input type="date" class="form-control" id="competition-date">
        </div>
        <div class="form-group">
          <label>地点</label>
          <input type="text" class="form-control" id="competition-location" placeholder="如：内蒙古 乌兰察布">
        </div>
        <div class="form-group">
          <label>成绩</label>
          <input type="text" class="form-control" id="competition-result" placeholder="如：全国一等奖 / 第 3 名">
        </div>
        <div class="form-group">
          <label>描述</label>
          <textarea class="form-control" id="competition-description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>封面图</label>
          <div class="upload-area">
            <div class="upload-preview" id="cover-preview">
              <span class="upload-placeholder">暂无图片</span>
            </div>
            <div class="upload-info">
              <span class="upload-url" id="cover-url"></span>
              <input type="hidden" id="cover-input">
              <button type="button" class="btn btn-secondary btn-sm" onclick="uploadCoverImage()">上传封面</button>
              <input type="file" id="cover-file" accept="image/*" style="display:none">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>图集</label>
          <button type="button" class="btn btn-secondary btn-sm" onclick="addGalleryImage()">+ 添加图片</button>
          <input type="file" id="gallery-file" accept="image/*" multiple style="display:none">
          <div class="gallery-list" id="gallery-list"></div>
          <p class="form-hint">最多可上传 12 张图片</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveCompetition()">保存</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/page/competitions.js"></script>
  <script>
    checkAuth();
    loadCompetitions();
  </script>
</body>
</html>
