<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>队员管理 - 管理后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html">数据概览</a>
        <a href="content.html">内容管理</a>
        <a href="images.html">图片管理</a>
        <a href="competitions.html">赛事管理</a>
        <a href="members.html" class="active">队员管理</a>
        <a href="recruits.html">招新管理</a>
        <a href="sponsors.html">赞助商管理</a>
        <a href="messages.html">留言管理</a>
        <a href="settings.html">账号设置</a>
      </nav>
      <div class="admin-footer">
        <a href="#" onclick="logout()">退出登录</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>队员管理</h1>
        <div class="admin-user">管理员</div>
      </header>
      <div class="admin-content">
        <div class="page-toolbar">
          <div class="filter-bar">
            <label>状态：
              <select id="filter-status" onchange="loadMembers()">
                <option value="">全部</option>
                <option value="current">现任</option>
                <option value="alumni">往届</option>
              </select>
            </label>
            <label>届别：
              <input type="text" id="filter-grade" placeholder="如：2024" onkeyup="if(event.key==='Enter') loadMembers()">
            </label>
            <button class="btn btn-secondary btn-sm" onclick="loadMembers()">筛选</button>
          </div>
          <button class="btn btn-primary" onclick="openModal()">+ 新增队员</button>
        </div>
        <div class="admin-table">
          <table>
            <thead>
              <tr>
                <th>头像</th>
                <th>姓名</th>
                <th>职位</th>
                <th>部门</th>
                <th>届别</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="member-list">
            </tbody>
          </table>
          <div class="empty-state" id="empty-state" style="display:none;">暂无队员记录</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑模态框 -->
  <div class="modal-overlay" id="member-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-title">新增队员</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="member-id">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" class="form-control" id="member-name" placeholder="队员姓名">
        </div>
        <div class="form-group">
          <label>职位</label>
          <input type="text" class="form-control" id="member-position" placeholder="如：队长 / 车手">
        </div>
        <div class="form-group">
          <label>部门</label>
          <input type="text" class="form-control" id="member-department" placeholder="如：动力组 / 悬架组">
        </div>
        <div class="form-group">
          <label>届别</label>
          <input type="text" class="form-control" id="member-grade" placeholder="如：2024">
        </div>
        <div class="form-group">
          <label>状态</label>
          <select class="form-control" id="member-status">
            <option value="current">现任</option>
            <option value="alumni">往届</option>
          </select>
        </div>
        <div class="form-group">
          <label>头像</label>
          <div class="upload-area">
            <div class="upload-preview" id="avatar-preview">
              <span class="upload-placeholder">暂无头像</span>
            </div>
            <div class="upload-info">
              <span class="upload-url" id="avatar-url"></span>
              <input type="hidden" id="avatar-input">
              <button type="button" class="btn btn-secondary btn-sm" onclick="uploadAvatarImage()">上传头像</button>
              <input type="file" id="avatar-file" accept="image/*" style="display:none">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>个人简介</label>
          <textarea class="form-control" id="member-bio" rows="4"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveMember()">保存</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/page/members.js"></script>
  <script>
    checkAuth();
    loadMembers();
  </script>
</body>
</html>
