<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赞助商管理 - 管理后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html">数据概览</a>
        <a href="content.html">内容管理</a>
        <a href="images.html">图片管理</a>
        <a href="competitions.html">赛事管理</a>
        <a href="members.html">队员管理</a>
        <a href="recruits.html">招新管理</a>
        <a href="sponsors.html" class="active">赞助商管理</a>
        <a href="messages.html">留言管理</a>
        <a href="settings.html">账号设置</a>
      </nav>
      <div class="admin-footer">
        <a href="#" onclick="logout()">退出登录</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>赞助商管理</h1>
        <div class="admin-user">管理员</div>
      </header>
      <div class="admin-content">
        <div class="page-toolbar">
          <h2>赞助商列表</h2>
          <button class="btn btn-primary" onclick="openModal()">+ 新增赞助商</button>
        </div>
        <div class="admin-table">
          <table>
            <thead>
              <tr>
                <th>Logo</th>
                <th>名称</th>
                <th>级别</th>
                <th>官网</th>
                <th>排序</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="sponsor-list">
            </tbody>
          </table>
          <div class="empty-state" id="empty-state" style="display:none;">暂无赞助商</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑模态框 -->
  <div class="modal-overlay" id="sponsor-modal">
    <div class="modal-dialog" style="width:520px;">
      <div class="modal-header">
        <h3 id="modal-title">新增赞助商</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="sponsor-id">
        <div class="form-group">
          <label>名称 *</label>
          <input type="text" class="form-control" id="sponsor-name" placeholder="赞助商名称">
        </div>
        <div class="form-group">
          <label>级别</label>
          <select class="form-control" id="sponsor-level">
            <option value="gold">金牌赞助 (Gold)</option>
            <option value="silver">银牌赞助 (Silver)</option>
            <option value="bronze">铜牌赞助 (Bronze)</option>
            <option value="partner">合作伙伴 (Partner)</option>
          </select>
        </div>
        <div class="form-group">
          <label>官网地址</label>
          <input type="url" class="form-control" id="sponsor-website" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Logo</label>
          <div class="upload-area">
            <div class="upload-preview" id="logo-preview">
              <span class="upload-placeholder">暂无Logo</span>
            </div>
            <div class="upload-info">
              <span class="upload-url" id="logo-url"></span>
              <input type="hidden" id="logo-input">
              <button type="button" class="btn btn-secondary btn-sm" onclick="uploadLogoImage()">上传Logo</button>
              <input type="file" id="logo-file" accept="image/*" style="display:none">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>简介</label>
          <textarea class="form-control" id="sponsor-intro" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>排序</label>
          <input type="number" class="form-control" id="sponsor-sort" value="0" placeholder="数字越小越靠前">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveSponsor()">保存</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/page/sponsors.js"></script>
  <script>
    checkAuth();
    loadSponsors();
  </script>
</body>
</html>
