<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言管理 - 管理后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html">数据概览</a>
        <a href="content.html">内容管理</a>
        <a href="images.html">图片管理</a>
        <a href="competitions.html">赛事管理</a>
        <a href="members.html">队员管理</a>
        <a href="recruits.html">招新管理</a>
        <a href="sponsors.html">赞助商管理</a>
        <a href="messages.html" class="active">留言管理</a>
        <a href="settings.html">账号设置</a>
      </nav>
      <div class="admin-footer">
        <a href="#" onclick="logout()">退出登录</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>留言管理</h1>
        <div class="admin-user">管理员</div>
      </header>
      <div class="admin-content">
        <div class="page-toolbar">
          <div class="filter-bar">
            <label>状态：
              <select id="filter-read" onchange="loadMessages()">
                <option value="">全部</option>
                <option value="false">未读</option>
                <option value="true">已读</option>
              </select>
            </label>
          </div>
        </div>
        <div class="admin-table">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>邮箱</th>
                <th>主题</th>
                <th>状态</th>
                <th>提交时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="message-list">
            </tbody>
          </table>
          <div class="empty-state" id="empty-state" style="display:none;">暂无留言</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 详情模态框 -->
  <div class="modal-overlay" id="message-modal">
    <div class="modal-dialog" style="width:560px;">
      <div class="modal-header">
        <h3>留言详情</h3>
        <button class="modal-close" onclick="closeMessageModal()">&times;</button>
      </div>
      <div class="modal-body" id="message-detail">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeMessageModal()">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/page/messages.js"></script>
  <script>
    checkAuth();
    loadMessages();
  </script>
</body>
</html>
